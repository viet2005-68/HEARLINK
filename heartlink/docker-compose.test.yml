name: heartlink-tests
services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: heartlink_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d heartlink_test"]
      interval: 2s
      timeout: 5s
      retries: 20
