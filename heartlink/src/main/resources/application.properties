spring.application.name=heartlink

spring.datasource.url=jdbc:postgresql://localhost:5432/heartlink
spring.datasource.username=postgres
spring.datasource.password=123456

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false


# JWT (dev defaults - override JWT_SECRET outside local dev; must be >= 32 bytes)
app.jwt.secret=${JWT_SECRET:heartlink-dev-secret-change-me-please-32b}
app.jwt.expires-in=3600
app.jwt.refresh-expires-in=604800
