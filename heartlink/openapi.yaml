openapi: 3.0.3
info:
  title: HeartLink API
  version: 1.0.0
  description: Phase 1 API for authentication, recommendations, swipes, matches and notifications.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
paths:
  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Log in with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, example: anna@example.com }
                password: { type: string, example: "123456" }
      responses:
        '200':
          description: Tokens issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Register an account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, name]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 6, maxLength: 72 }
                name: { type: string, maxLength: 100 }
                bio: { type: string, nullable: true }
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer, format: int64 }
                  email: { type: string }
                  name: { type: string }
                  bio: { type: string, nullable: true }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate refresh token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        '200':
          description: New token pair issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Revoke refresh token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        '204': { description: Token revoked }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/v1/recommendations:
    get:
      tags: [Recommendations]
      summary: List profiles not swiped by the current user
      parameters:
        - in: query
          name: limit
          schema: { type: integer, default: 20, minimum: 1, maximum: 50 }
      responses:
        '200':
          description: Candidate profiles
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Profile' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/swipes:
    post:
      tags: [Swipes]
      summary: Like or pass a profile; returns a match when likes are mutual
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_id, action]
              properties:
                target_id: { type: integer, format: int64 }
                action: { type: string, enum: [like, pass] }
      responses:
        '201':
          description: Swipe recorded
          content:
            application/json:
              schema:
                type: object
                required: [swipe_id, matched, match]
                properties:
                  swipe_id: { type: integer, format: int64 }
                  matched: { type: boolean }
                  match:
                    type: object
                    nullable: true
                    properties:
                      id: { type: integer, format: int64 }
                      with_user_id: { type: integer, format: int64 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/matches:
    get:
      tags: [Matches]
      summary: List active matches of the current user
      parameters:
        - in: query
          name: limit
          schema: { type: integer, default: 20, minimum: 1, maximum: 50 }
        - in: query
          name: offset
          schema: { type: integer, format: int64, default: 0, minimum: 0 }
      responses:
        '200':
          description: Paginated active matches
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MatchPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/matches/{id}:
    delete:
      tags: [Matches]
      summary: Cancel an active match (soft delete)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '204': { description: Match cancelled }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/matches/{matchId}/messages:
    parameters:
      - in: path
        name: matchId
        required: true
        schema: { type: integer, format: int64, minimum: 1 }
    post:
      tags: [Chat]
      summary: Send a text message to an active match
      description: Sender is determined by JWT. Only active match participants can send messages. Text is stored as plain text; render it as text on the client.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string, minLength: 1, maxLength: 2000, example: "Chào bạn!" }
      responses:
        '201':
          description: Message persisted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    get:
      tags: [Chat]
      summary: Read message history of an active match
      description: Newest ID first. Pass next_before as before for older messages. Omit before to refresh the latest page. A null next_before means no older page. Only active match participants can read history.
      parameters:
        - in: query
          name: limit
          schema: { type: integer, default: 20, minimum: 1, maximum: 50 }
        - in: query
          name: before
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        '200':
          description: Message page
          content:
            application/json:
              schema:
                type: object
                required: [items, next_before]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Message' }
                  next_before: { type: integer, format: int64, nullable: true }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/notifications:
    get:
      tags: [Notifications]
      summary: Read the current user's notification history
      parameters:
        - in: query
          name: limit
          schema: { type: integer, default: 20, minimum: 1, maximum: 50 }
        - in: query
          name: cursor
          schema: { type: string, nullable: true }
      responses:
        '200':
          description: Notification page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/notifications/stream:
    get:
      tags: [Notifications]
      summary: Subscribe to notification events using Server-Sent Events
      responses:
        '200':
          description: Event stream; clients should also read notification history after reconnecting
          content:
            text/event-stream:
              schema: { type: string, description: SSE events containing notification data JSON }
        '401': { $ref: '#/components/responses/Unauthorized' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Message:
      type: object
      required: [id, sender_id, content, created_at]
      properties:
        id: { type: integer, format: int64 }
        sender_id: { type: integer, format: int64 }
        content: { type: string, maxLength: 2000 }
        created_at: { type: string, format: date-time }
    TokenResponse:
      type: object
      required: [access_token, token_type, expires_in, refresh_token]
      properties:
        access_token: { type: string }
        token_type: { type: string, example: bearer }
        expires_in: { type: integer, format: int64, example: 3600 }
        refresh_token: { type: string }
    Profile:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        bio: { type: string, nullable: true }
    MatchPage:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              id: { type: integer, format: int64 }
              user: { $ref: '#/components/schemas/Profile' }
              status: { type: string, enum: [ACTIVE] }
              createdAt: { type: string, format: date-time }
        limit: { type: integer }
        offset: { type: integer, format: int64 }
        total: { type: integer, format: int64 }
    NotificationPage:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              id: { type: integer, format: int64 }
              type: { type: string, example: MATCH_CREATED }
              match_id: { type: integer, format: int64 }
              created_at: { type: string, format: date-time }
        next_cursor: { type: string, nullable: true }
    ApiError:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Unauthorized:
      description: Missing, invalid or expired access token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Forbidden:
      description: Operation is not allowed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Conflict:
      description: Request conflicts with current state
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
